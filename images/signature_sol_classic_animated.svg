<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="680" height="200" viewBox="0 0 680 200">
<defs>
<linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="0%">
<stop offset="0%" stop-color="#5a3b14"/>
<stop offset="50%" stop-color="#f6d37a"/>
<stop offset="100%" stop-color="#7a5218"/>
<animateTransform attributeName="gradientTransform" type="translate" values="-1 0;1 0;-1 0" dur="4s" repeatCount="indefinite"/>
</linearGradient>
<filter id="glow">
<feGaussianBlur stdDeviation="2" result="b"/>
<feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
</defs>

<path id="trail" d="M80 145 C220 175 470 165 620 120" fill="none" stroke="none"/>

<g filter="url(#glow)">
<path d="M70 145 C55 145 55 90 90 90 C120 90 120 140 90 140
M120 140 C180 40 250 40 290 135
M290 135 C330 65 390 65 430 135
M430 135 C470 55 545 55 600 120"
fill="none" stroke="url(#gold)" stroke-width="4" stroke-linecap="round"
stroke-linejoin="round" stroke-dasharray="1200" stroke-dashoffset="1200">
<animate attributeName="stroke-dashoffset" from="1200" to="0" dur="6s" repeatCount="indefinite"/>
</path>

<text x="165" y="128" font-size="82" font-style="italic"
font-family="Brush Script MT, URW Chancery L, cursive"
fill="url(#gold)">Sol</text>

<path d="M120 142 C300 170 520 160 620 120" fill="none"
stroke="url(#gold)" stroke-width="2">
<animateTransform attributeName="transform" type="rotate"
values="-2 620 120;2 620 120;-2 620 120"
dur="3.5s" repeatCount="indefinite"/>
</path>
</g>

<circle r="4" fill="#f8df98">
<animateMotion dur="6s" repeatCount="indefinite">
<mpath href="#trail"/>
</animateMotion>
</circle>
<circle r="2.5" fill="#fff3c2">
<animateMotion dur="8s" begin="1s" repeatCount="indefinite">
<mpath href="#trail"/>
</animateMotion>
</circle>
</svg>
